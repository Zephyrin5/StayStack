# Publishes the API as a Native AOT binary and starts it against Postgres.
#
# UNVERIFIED: this workflow has never run. It is expected to fail today - EF Core
# 10.0.11 refuses to generate a compiled model for a model with query filters
# (docs/aot-migration.md), and the runtime gaps behind that are exactly what a
# publish surfaces. It exists so the failure is one click away and reproducible,
# rather than something to reconstruct later.
#
# Manual only. Uncomment the schedule once a publish is expected to succeed; a
# weekly job that always fails is a job everyone learns to ignore.
name: Native AOT publish trial

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 4 * * 1"

jobs:
  publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staystack_aot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Directory.Packages.props

      # The native toolchain the ILCompiler shells out to. The ordinary CI job
      # needs none of this, which is why it analyses rather than publishes.
      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore StayStack.slnx

      - name: Publish Native AOT
        run: >
          dotnet publish src/Web/Api/Api.csproj --no-restore -c Release -r linux-x64
          -p:PublishAot=true -o artifacts/aot

      - name: Apply migrations
        env:
          ConnectionStrings__AppConnection: "Host=localhost;Port=5432;Database=staystack_aot;Username=postgres;Password=postgres"
        run: dotnet ef database update --project src/Infrastructure/Database --context AppDbContext

      # A native binary that starts, reads its configuration, opens a connection
      # and answers readiness is the claim worth testing. Everything reflective
      # in EF Core, Npgsql and the JSON path runs before that endpoint answers.
      - name: Start it and ask for readiness
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__AppConnection: "Host=localhost;Port=5432;Database=staystack_aot;Username=postgres;Password=postgres"
          App__Auth__Token__Key: "Aot-Publish-Trial-Signing-Key-Never-Used-Outside-CI!"
          App__Auth__Token__Issuer: "http://127.0.0.1:5080"
          App__Auth__Token__Audience: "http://127.0.0.1:5080"
          # Nothing sits in front of this process, and the validator refuses to
          # start outside Development without one answer or the other.
          App__ForwardedHeaders__ExposedDirectly: "true"
          App__Cookies__RequireSecure: "false"
        run: |
          ./artifacts/aot/Api > aot-run.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/health/ready; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "never became ready"
          exit 1

      # The log is the deliverable when this fails: every blocker it names goes
      # into docs/aot-migration.md.
      - name: Publish the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-run-log
          path: aot-run.log
          if-no-files-found: ignore
